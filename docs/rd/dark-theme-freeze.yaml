artifact_type: theme_freeze
theme_id: dark
platform_baseline: ios_hig
color_roles:
  primary: "#5FB5B7"
  on_primary: "#0E1B1E"
  secondary: "#274148"
  on_secondary: "#E8F1F2"
  accent: "#F2A28E"
surface_roles:
  background: "#0F171A"
  surface: "#162226"
  surface_subtle: "#1B2A2E"
  surface_elevated: "#223238"
  surface_inverse: "#F7F4EC"
text_roles:
  text_primary: "#EEF3F3"
  text_secondary: "#BDD0D3"
  text_tertiary: "#8BA0A6"
  text_inverse: "#18343A"
icon_roles:
  icon_primary: "#7DCDD0"
  icon_secondary: "#A7BDC3"
  icon_inverse: "#18343A"
border_roles:
  border_subtle: "#2B4046"
  border_strong: "#4A6870"
  divider: "#213137"
status_roles:
  success: "#65B79B"
  on_success: "#0E1C17"
  warning: "#E0B165"
  on_warning: "#20180C"
  error: "#E28A80"
  on_error: "#231413"
  info: "#8AB9CC"
  on_info: "#111C21"
shadow_or_overlay_roles:
  shadow_color: "rgba(0, 0, 0, 0.36)"
  overlay_scrim: "rgba(8, 12, 14, 0.52)"
  focus_ring: "#8DD0D4"
component_state_roles:
  primary_button:
    background_default: "#5FB5B7"
    background_pressed: "#4DA3A6"
    background_disabled: "#39595D"
    text_default: "#0E1B1E"
    text_disabled: "#8AA2A7"
  secondary_button:
    background_default: "#203136"
    background_pressed: "#284046"
    background_disabled: "#172328"
    text_default: "#DCEBEC"
    text_disabled: "#73898F"
    border_default: "#355059"
  input_field:
    background_default: "#162226"
    background_disabled: "#131D20"
    border_default: "#2D434A"
    border_focused: "#8DD0D4"
    border_error: "#E28A80"
    text_default: "#EEF3F3"
    placeholder: "#779097"
  card:
    background_default: "#162226"
    background_subtle: "#1C2A2F"
    border_default: "#284046"
    shadow_default: "rgba(0, 0, 0, 0.28)"
contrast_rules:
  body_text_on_background: ">= 4.5:1"
  body_text_on_surface: ">= 4.5:1"
  text_on_primary: ">= 4.5:1"
  cta_text_on_primary: ">= 4.5:1"
  essential_iconography: ">= 3:1"
forbidden_overrides:
  - "Do not invert the light theme mechanically."
  - "Do not brighten surfaces until cards and background lose depth separation."
  - "Do not shift accent into neon or gaming-style saturation."
  - "Do not collapse secondary text and tertiary text into the same contrast band."
