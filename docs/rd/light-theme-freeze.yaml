artifact_type: theme_freeze
theme_id: light
platform_baseline: ios_hig
color_roles:
  primary: "#1F6E73"
  on_primary: "#FFFDF8"
  secondary: "#DCECF0"
  on_secondary: "#18343A"
  accent: "#F28E74"
surface_roles:
  background: "#FBF7F0"
  surface: "#FFFFFF"
  surface_subtle: "#F3F7F7"
  surface_elevated: "#FFFDFC"
  surface_inverse: "#17343A"
text_roles:
  text_primary: "#18343A"
  text_secondary: "#5C7280"
  text_tertiary: "#8EA0AB"
  text_inverse: "#FFF9F2"
icon_roles:
  icon_primary: "#1F6E73"
  icon_secondary: "#6C808B"
  icon_inverse: "#FFF9F2"
border_roles:
  border_subtle: "#D9E5E8"
  border_strong: "#8FB0B5"
  divider: "#E7EEEF"
status_roles:
  success: "#3D8E78"
  on_success: "#F7FFFB"
  warning: "#D8A04C"
  on_warning: "#FFF9F0"
  error: "#D96F64"
  on_error: "#FFF8F7"
  info: "#6D97A8"
  on_info: "#F8FCFE"
shadow_or_overlay_roles:
  shadow_color: "rgba(24, 52, 58, 0.10)"
  overlay_scrim: "rgba(23, 52, 58, 0.18)"
  focus_ring: "#6FA7B0"
component_state_roles:
  primary_button:
    background_default: "#1F6E73"
    background_pressed: "#185A5E"
    background_disabled: "#9AB7BA"
    text_default: "#FFFDF8"
    text_disabled: "#F5F3EE"
  secondary_button:
    background_default: "#EEF5F6"
    background_pressed: "#E0ECEE"
    background_disabled: "#F4F6F7"
    text_default: "#1F6E73"
    text_disabled: "#92A5AC"
    border_default: "#C8DADD"
  input_field:
    background_default: "#FFFFFF"
    background_disabled: "#F5F7F7"
    border_default: "#D5E1E4"
    border_focused: "#6FA7B0"
    border_error: "#D96F64"
    text_default: "#18343A"
    placeholder: "#8EA0AB"
  card:
    background_default: "#FFFFFF"
    background_subtle: "#F6FAFA"
    border_default: "#E1ECEE"
    shadow_default: "rgba(24, 52, 58, 0.08)"
contrast_rules:
  body_text_on_background: ">= 4.5:1"
  body_text_on_surface: ">= 4.5:1"
  text_on_primary: ">= 4.5:1"
  cta_text_on_primary: ">= 4.5:1"
  essential_iconography: ">= 3:1"
forbidden_overrides:
  - "Do not replace semantic primary with ad-hoc gradients."
  - "Do not move primary CTA into the same contrast band as secondary controls."
  - "Do not turn warning or error roles into saturated alarm red."
  - "Do not darken text roles until body contrast drops below the stated rules."
