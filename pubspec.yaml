name: rhythm
description: "本地优先的作息行为管理 Flutter 应用。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 路由与状态管理：适合“今日 / 日历 / 睡前 / 洞察 / 我的”多模块拆分。
  flutter_riverpod: ^3.0.3
  flutter_hooks: ^0.21.3+1
  go_router: ^17.2.3
  hooks_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # 本地数据与模型：支撑睡眠记录、周报、恢复计划等结构化数据。
  collection: ^1.19.1
  drift: ^2.28.2
  flutter_secure_storage: ^10.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  uuid: ^4.5.3

  # 健康数据与设备环境：覆盖 HealthKit / Health Connect 和基础设备信息。
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  health: ^13.3.1

  # 提醒、小组件与时区：支撑睡前提醒、周报提醒和桌面快捷入口。
  flutter_local_notifications: ^20.1.0
  flutter_timezone: ^5.0.2
  home_widget: ^0.9.1
  package_info_plus: ^9.0.1
  timezone: ^0.10.1

  # 账号、同步与会员：覆盖登录、云同步、订阅和换机恢复。
  google_sign_in: ^7.2.0
  purchases_flutter: ^10.1.1
  sign_in_with_apple: ^7.0.1
  supabase_flutter: ^2.12.4

  # 展示层辅助：支撑趋势图和时间文案展示。
  fl_chart: ^1.2.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
